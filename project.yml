name: NewsWidgets
options:
  bundleIdPrefix: com.benburnette
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
    GENERATE_INFOPLIST_FILE: NO

targets:
  NewsWidgets:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Widgets/NewsModels.swift
      - path: Widgets/NewsService.swift
      - path: Widgets/SourcesStore.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: News Widgets
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.news
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.benburnette.NewsWidgets
            CFBundleURLSchemes:
              - newswidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benburnette.NewsWidgets
        PRODUCT_NAME: NewsWidgets
        CODE_SIGN_ENTITLEMENTS: App/NewsWidgets.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../PlugIns"
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: NewsWidgetsExtension
        embed: true
        codeSign: true

  NewsWidgetsExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: News Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benburnette.NewsWidgets.WidgetsExtension
        PRODUCT_NAME: NewsWidgetsExtension
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        SKIP_INSTALL: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
        ENABLE_PREVIEWS: YES
